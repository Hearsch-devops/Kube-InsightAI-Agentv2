apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-insightai-frontend
  namespace: kube-insightai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-insightai-frontend
  template:
    metadata:
      labels:
        app: kube-insightai-frontend
    spec:
      containers:
        - name: kube-insightai-frontend
          image: 95337/kube-insightai-frontend:BUILD_TAG
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: kube-insightai-frontend
  namespace: kube-insightai
spec:
  selector:
    app: kube-insightai-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
  type: NodePort
