apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-insightaiv2-mcp
  namespace: kube-insightaiv2

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-insightaiv2-mcp-read-only-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-insightai-read-only
subjects:
  - kind: ServiceAccount
    name: kube-insightaiv2-mcp
    namespace: kube-insightaiv2

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-insightaiv2-mcp
  namespace: kube-insightaiv2
spec:
  replicas: 1

  selector:
    matchLabels:
      app: kube-insightaiv2-mcp

  template:
    metadata:
      labels:
        app: kube-insightaiv2-mcp

    spec:
      serviceAccountName: kube-insightaiv2-mcp

      containers:
        - name: kube-insightaiv2-mcp
          image: 95337/kube-insightaiv2-mcp:1
          imagePullPolicy: Always

          ports:
            - containerPort: 8001

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: kube-insightaiv2-mcp
  namespace: kube-insightaiv2

spec:
  type: ClusterIP

  selector:
    app: kube-insightaiv2-mcp

  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP