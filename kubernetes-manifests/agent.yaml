apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-insightaiv2-agent
  namespace: kube-insightaiv2
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: kube-insightaiv2-agent
  template:
    metadata:
      labels:
        app: kube-insightaiv2-agent
    spec:
      serviceAccountName: kube-insightaiv2-agent

      containers:
        - name: kube-insightaiv2-agent
          image: 95337/kube-insightaiv2-agent:BUILD_TAG
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          volumeMounts:
          - name: kube-insightai-data
            mountPath: /app/data

          env:
            - name: LLMFOUNDRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kube-insightai-llm
                  key: LLMFOUNDRY_TOKEN

            - name: PROJECT_NAME
              valueFrom:
                secretKeyRef:
                  name: kube-insightai-llm
                  key: PROJECT_NAME

            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kube-insightai-auth
                  key: AUTH_SECRET_KEY

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kube-insightai-db-credentials
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kube-insightai-db-credentials
                  key: DB_PASSWORD

            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USERNAME):$(DB_PASSWORD)@postgres.postgresql.svc.cluster.local:5432/kube_insightai"
              
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

      volumes:
      - name: kube-insightai-data
        persistentVolumeClaim:
          claimName: kube-insightai-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kube-insightaiv2-agent
  namespace: kube-insightaiv2
spec:
  selector:
    app: kube-insightaiv2-agent
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

#Changed the Kube-InsightAI Agent Deployment from the default RollingUpdate strategy to Recreate. This prevents overlapping Agent pods during deployments and avoids scheduling failures caused by insufficient worker-node memory