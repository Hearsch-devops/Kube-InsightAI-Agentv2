apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-insightaiv2-agent
  namespace: kube-insightai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-insightaiv2-agent
  template:
    metadata:
      labels:
        app: kube-insightaiv2-agent
    spec:
      containers:
        - name: kube-insightaiv2-agent
          image: 95337/kube-insightaiv2-agent:BUILD_TAG
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: LLMFOUNDRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kube-insightai-llm
                  key: LLMFOUNDRY_TOKEN

            - name: PROJECT_NAME
              valueFrom:
                secretKeyRef:
                  name: kube-insightai-llm
                  key: PROJECT_NAME

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kube-insightaiv2-agent
  namespace: kube-insightai
spec:
  selector:
    app: kube-insightaiv2-agent
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
