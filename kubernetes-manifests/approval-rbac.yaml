
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-approval
  namespace: kube-insightaiv2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-insightai-approval
rules:
  # View pods, logs, events, namespaces, and workload status
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - namespaces
    verbs: ["get", "list", "watch"]

  # Create, modify, delete, scale, and restart deployments
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # View workload controllers and manage their rollout/restart
  - apiGroups: ["apps"]
    resources:
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch", "patch", "update"]

  # Manage Services
  - apiGroups: [""]
    resources:
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Manage Ingresses and NetworkPolicies
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-approval-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-insightai-approval
subjects:
  - kind: ServiceAccount
    name: app-approval
    namespace: kube-insightaiv2
