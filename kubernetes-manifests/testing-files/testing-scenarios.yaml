apiVersion: v1
kind: Namespace
metadata:
  name: testing-files
---
# Scenario 1: Healthy pod — baseline for comparison.
apiVersion: v1
kind: Pod
metadata:
  name: scenario-1-healthy
  namespace: testing-files
  labels:
    app: healthy-pod
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sh", "-c", "echo 'Pod is healthy and running' && sleep 3600"]
---
# Scenario 2: ImagePullBackOff — deliberately invalid image tag.
apiVersion: v1
kind: Pod
metadata:
  name: scenario-2-imagepullbackoff
  namespace: testing-files
  labels:
    app: image-pull-fail
spec:
  containers:
  - name: busybox
    image: busybox:nonexistent-tag-12345
    command: ["sh", "-c", "sleep 3600"]
---
# Scenario 3: CrashLoopBackOff — process exits unsuccessfully on every start.
apiVersion: v1
kind: Pod
metadata:
  name: scenario-3-crashloopbackoff
  namespace: testing-files
  labels:
    app: crash-loop
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sh", "-c", "echo 'Failing process...' && exit 1"]
---
# Scenario 4: Readiness failure — container runs, but the probe returns HTTP 404.
apiVersion: v1
kind: Pod
metadata:
  name: scenario-4-readiness-failure
  namespace: testing-files
  labels:
    app: readiness-fail
spec:
  containers:
  - name: busybox
    image: busybox:latest
    # Simple HTTP server using built-in httpd (busybox) returning 404 for missing route
    command: ["sh", "-c", "mkdir /www && httpd -f -p 8080 -h /www"]
    ports:
    - containerPort: 8080
    readinessProbe:
      httpGet:
        path: /nonexistent-endpoint
        port: 8080
      initialDelaySeconds: 2
      periodSeconds: 5
---
# Scenario 5: Pending / unschedulable — no node is expected to have this label.
apiVersion: v1
kind: Pod
metadata:
  name: scenario-5-unschedulable
  namespace: testing-files
  labels:
    app: pending-node-selector
spec:
  nodeSelector:
    non-existent-label/node-type: nonexistent-value
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sh", "-c", "sleep 3600"]