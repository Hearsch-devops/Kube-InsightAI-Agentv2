apiVersion: apps/v1
kind: Deployment
metadata:
  name: calccast-mcp
  namespace: calccast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calccast-mcp
  template:
    metadata:
      labels:
        app: calccast-mcp
    spec:
      containers:
        - name: calculator-mcp
          image: 95337/calccast-mcp:BUILD_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: calccast-mcp
  namespace: calccast
spec:
  selector:
    app: calccast-mcp
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP