apiVersion: apps/v1
kind: Deployment
metadata:
  name: calccast-weather
  namespace: calccast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calccast-weather
  template:
    metadata:
      labels:
        app: calccast-weather
    spec:
      containers:
        - name: weather-mcp
          image: 95337/calccast-weather:BUILD_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: calccast-weather
  namespace: calccast
spec:
  selector:
    app: calccast-weather
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP